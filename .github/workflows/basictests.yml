kname: Lab9 Basic Tests

on:
  push:
    branches: [ "main", "master", "test" ]
  workflow_dispatch: # Allows you to run this manually from the Actions tab

jobs:
  lab9-basic-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run Test 1 (Should PASS)
      run: bash validate-data.sh "pearse mccarthy" "0831122334"

    - name: Run Test 2 (Should FAIL)
      run: bash validate-data.sh "pearse mccarthy" "08311223344"

    - name: Run Test 3 (Should FAIL)
      run: bash validate-data.sh "pearseT mccarthy" "0831122334"
